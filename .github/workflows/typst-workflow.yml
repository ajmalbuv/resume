name: Typst Compilation

on:
  push:
    branches:
      - master
    paths:
      - "**/*.typ"
      - "lib/**"
      - "photo.jpg"
  pull_request:
    branches:
      - master
    paths:
      - "**/*.typ"
      - "lib/**"
      - "photo.jpg"
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Rebuild all files"
        required: false
        type: boolean
        default: false

concurrency:
  group: typst-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Typst (Standardized Version)
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            lib:
              - lib/**
            photo:
              - photo.jpg
            root:
              - "*.typ"

      - name: Determine files to compile
        id: files
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.rebuild_all }}" == "true" ]] || [[ "${{ steps.changed-files.outputs.lib_any_changed }}" == "true" ]] || [[ "${{ steps.changed-files.outputs.photo_any_changed }}" == "true" ]]; then
            echo "Lib/Photo changed or manual full rebuild. Recompiling all root Typst files..."
            FILES=$(find . -maxdepth 1 -name "*.typ" | sed 's|^./||' | xargs)
          else
            echo "Source files changed. Compiling only changed files..."
            FILES="${{ steps.changed-files.outputs.root_all_changed_files }}"
          fi

          if [[ -z "$FILES" && ("${{ steps.changed-files.outputs.any_changed }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch") ]]; then
            echo "FILES is empty but rebuild is required. Falling back to all root files..."
            FILES=$(find . -maxdepth 1 -name "*.typ" | sed 's|^./||' | xargs)
          fi

          # Filter out non-existent/deleted files and non-typ files
          VALID_FILES=""
          for f in $FILES; do
            if [[ -f "$f" && "$f" == *.typ && "$f" != lib/* ]]; then
              VALID_FILES="$VALID_FILES $f"
            fi
          done
          VALID_FILES=$(echo "$VALID_FILES" | xargs)

          if [[ -z "$VALID_FILES" ]]; then
            echo "any=false" >> $GITHUB_OUTPUT
          else
            echo "any=true" >> $GITHUB_OUTPUT
            echo "all=$VALID_FILES" >> $GITHUB_OUTPUT
            echo "Files to compile: $VALID_FILES"
          fi

      - name: Compile Typst files (Native PDF & 300 DPI PNG)
        if: steps.files.outputs.any == 'true'
        run: |
          for file in ${{ steps.files.outputs.all }}; do
            [[ ! -f "$file" ]] && continue
            [[ "$file" != *.typ ]] && continue
            [[ "$file" == lib/* ]] && continue
            [[ "$file" == ./* ]] && file="${file#./}"
            
            base="${file%.typ}"
            pdf="${base}.pdf"
            png="${base}.png"
            
            echo "Compiling $file -> $pdf..."
            typst compile --font-path fonts "$file" "$pdf"

            echo "Rendering $file -> $png (native 300 DPI)..."
            typst compile --font-path fonts --ppi 300 --pages 1 "$file" "$png"
          done

      - name: Commit changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Format and compile Typst files [skip ci]"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          file_pattern: "*.pdf *.png"
